[package]
name = "redliner"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "SLO-driven HTTP/GraphQL load testing with pacing profiles, data pools, and CI-gating reports"
license = "MIT"
repository = "https://github.com/danny-oneal/redliner"
homepage = "https://github.com/danny-oneal/redliner"
readme = "../../README.md"
keywords = ["load-testing", "benchmark", "graphql", "slo", "http"]
categories = ["command-line-utilities", "development-tools::testing"]

[[bin]]
name = "redliner"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
base64 = "0.22.1"
percent-encoding = "2.3.2"
regex = "1.11.1"
rand = "0.9.5"
rand_chacha = "0.9.0"
clap = { version = "4.5.61", features = ["derive"] }
http = "1.5.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml_ng = "0.10.0"
thiserror = "2.0.20"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2"] }
volley = { version = "0.1.0", path = "../volley" }
