# Template for the auth token Red Liner reads from the environment.
# Copy to secret.yaml (git-ignored), fill in the token, and apply:
#   cp deploy/k3s/secret.example.yaml deploy/k3s/secret.yaml
#   # edit deploy/k3s/secret.yaml, set BENCH_TOKEN
#   kubectl apply -f deploy/k3s/secret.yaml
# Then uncomment the env block in job.yaml and the auth block in the scenario.
apiVersion: v1
kind: Secret
metadata:
  name: redliner-auth
type: Opaque
stringData:
  BENCH_TOKEN: ""
