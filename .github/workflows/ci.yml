name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Clippy (warnings as errors)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      # Builds the packaged redliner against the packaged engine, as crates.io would.
      - name: Package
        run: cargo package --workspace --locked

  msrv:
    name: msrv (1.89)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Keep in step with `rust-version` in the crate manifests.
      - name: Install Rust 1.89
        uses: dtolnay/rust-toolchain@1.89

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      # `+1.89` beats rust-toolchain.toml, which pins `stable`.
      - name: Check on the minimum supported Rust
        run: cargo +1.89 check --workspace --all-targets --locked

  install-script:
    name: install script
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Shellcheck
        run: shellcheck -s sh scripts/*.sh

      - name: Install against a fake release
        run: make test-install

      - name: Release version bump and notes
        run: make test-release
