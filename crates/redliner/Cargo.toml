[package]
name = "redliner"
version.workspace = true
edition = "2021"
rust-version = "1.88"
description = "SLO-driven HTTP/GraphQL load testing with pacing profiles, data pools, and CI-gating reports"
license = "MIT"
repository = "https://github.com/danny-oneal/redliner"
homepage = "https://github.com/danny-oneal/redliner"
readme = "../../README.md"
keywords = ["load-testing", "benchmark", "graphql", "slo", "http"]
categories = ["command-line-utilities", "development-tools::testing"]

[[bin]]
name = "redliner"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
base64 = "0.22.1"
percent-encoding = "2.3.2"
regex = "1.11.1"
rand = "0.9.5"
rand_chacha = "0.9.0"
clap = { version = "4.5.61", features = ["derive"] }
http = "1.5.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml_ng = "0.10.0"
thiserror = "2.0.20"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "signal", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2"] }
# Published as redliner-volley (crates.io `volley` is an unrelated crate);
# imported as `volley`. Pinned exactly: the two crates release in lockstep.
volley = { package = "redliner-volley", version = "=0.4.1", path = "../volley" }
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
# The load generator's own CPU per request: ~23% less than glibc malloc, and
# ~2.3x less than musl's (5000 rps, local nginx).
mimalloc = { version = "0.1.52", default-features = false }

[dev-dependencies]
# The HTTPS mock behind the target.insecure_tls tests; already in the tree
# through reqwest's rustls.
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
