name: Release

# The version in Cargo.toml is the source of truth; nobody tags by hand.
# A push to main whose version has no v<version> tag yet is a release: build
# every target, then publish the GitHub release (which creates the tag) with
# that version's CHANGELOG section as its notes. Bump the version with
# scripts/release.sh in a "chore(release): X.Y.Z" PR.
on:
  push:
    branches: [main]
    # Only to reject a hand-pushed tag that doesn't match the crate version.
    tags: ["v*"]
  # Build (but don't publish) when the release pipeline itself changes, so a
  # broken target shows up in review instead of on the next release.
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/install.sh
      - scripts/release.sh
      - scripts/changelog-section.sh
      - Cargo.toml

permissions:
  contents: write

# One release at a time: a second merge waits, then sees its tag exists.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      build: ${{ steps.plan.outputs.build }}
      release: ${{ steps.plan.outputs.release }}
    steps:
      - uses: actions/checkout@v7

      - name: Version, tag and notes
        id: plan
        run: |
          version=$(cargo metadata --no-deps --format-version 1 |
            jq -r '.packages[] | select(.name == "redliner") | .version')
          tag="v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            tagged=true
          else
            tagged=false
          fi

          build=true
          release=false
          case "$GITHUB_EVENT_NAME/$GITHUB_REF_TYPE" in
            push/tag)
              if [ "$GITHUB_REF_NAME" != "$tag" ]; then
                echo "::error::tag $GITHUB_REF_NAME does not match the crate version $version. Don't tag by hand: bump the version with scripts/release.sh and merge it."
                exit 1
              fi
              release=true ;;
            push/branch)
              if [ "$tagged" = true ]; then
                echo "$tag is already released; nothing to do."
                build=false
              else
                release=true
              fi ;;
          esac

          # An unreleased version (a release, or a release PR) needs notes.
          if [ "$release" = true ] || [ "$tagged" = false ]; then
            sh scripts/changelog-section.sh "$version" > /dev/null
          fi

          {
            echo "version=$version"
            echo "tag=$tag"
            echo "build=$build"
            echo "release=$release"
          } >> "$GITHUB_OUTPUT"
          echo "version $version, tag $tag, build $build, release $release"

  build:
    name: ${{ matrix.target }}
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ${{ matrix.os }}
    env:
      # The tag on a release; otherwise a placeholder for the asset names.
      VERSION: ${{ needs.plan.outputs.release == 'true' && needs.plan.outputs.tag || 'ci' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          # Static binaries: run on any distro, in scratch/distroless images,
          # and on arm64 K3s nodes. musl-gcc builds ring and mimalloc.
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, musl: true }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, musl: true }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin, cross: true }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl-tools
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.musl }}" = "true" ]; then
            target_env=$(echo "${{ matrix.target }}" | tr '-' '_')
            export "CC_${target_env}=musl-gcc"
          fi
          cargo build --release --locked -p redliner --target ${{ matrix.target }}

      - name: Smoke test
        if: ${{ !matrix.cross }}
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/redliner"
          # The binary reports the version it's released as.
          reported=$("$bin" --version)
          echo "$reported"
          [ "$reported" = "redliner ${{ needs.plan.outputs.version }}" ]
          if [ "${{ matrix.musl }}" = "true" ]; then
            file "$bin" | tee /dev/stderr | grep -q "statically linked\|static-pie linked"
          fi

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          staging="redliner-${VERSION}-${{ matrix.target }}"
          tar -czf "${staging}.tar.gz" -C "target/${{ matrix.target }}/release" redliner
          shasum -a 256 "${staging}.tar.gz" > "${staging}.tar.gz.sha256"
          echo "ASSET=${staging}.tar.gz" >> "$GITHUB_ENV"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $staging = "redliner-$env:VERSION-${{ matrix.target }}"
          Compress-Archive -Path "target/${{ matrix.target }}/release/redliner.exe" -DestinationPath "$staging.zip"
          $hash = (Get-FileHash "$staging.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $staging.zip" | Out-File -FilePath "$staging.zip.sha256" -Encoding ascii -NoNewline
          "ASSET=$staging.zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload
        if: needs.plan.outputs.release == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.sha256
          retention-days: 1

  # Only after every target built, so a release never goes out half-populated.
  release:
    name: publish
    needs: [plan, build]
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Release notes
        run: sh scripts/changelog-section.sh "${{ needs.plan.outputs.version }}" > notes.md

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish the GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.plan.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.plan.outputs.tag }}
          body_path: notes.md
          # 0.x releases stay pre-releases (scripts/install.sh includes them).
          prerelease: ${{ startsWith(needs.plan.outputs.version, '0.') }}
          files: dist/*
