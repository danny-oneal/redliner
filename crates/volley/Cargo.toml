[package]
name = "volley"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "HTTP load-generation engine for Red Liner"

[dependencies]
futures = "0.3.34"
hdrhistogram = "7.5.4"
http = "1.5.0"
rand = "0.9.5"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rand_chacha = "0.9.0"
thiserror = "2.0.20"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "time", "sync"] }
