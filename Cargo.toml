[workspace]
resolver = "2"
members = ["crates/volley", "crates/redliner", "crates/redliner-import"]

# The one version for both crates, released together. scripts/release.sh bumps
# it (and redliner's pin on the engine); CI tags `v<version>` when it lands.
[workspace.package]
version = "0.5.0"

# A load generator's own overhead is part of every measurement, so release
# builds trade compile time for a faster, smaller binary. Panics still unwind:
# a panicking worker task must not take the partial report down with it.
[profile.release]
lto = "fat"
codegen-units = 1
strip = true
