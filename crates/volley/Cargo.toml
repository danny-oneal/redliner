[package]
name = "redliner-volley"
version.workspace = true
edition = "2021"
rust-version = "1.89"
description = "Async paced HTTP load-generation engine (the attack core behind Redliner)"
license = "MIT"
repository = "https://github.com/danny-oneal/redliner"
keywords = ["load-testing", "http", "benchmark", "async", "tokio"]
categories = ["network-programming", "development-tools::testing"]

[dependencies]
hdrhistogram = "7.5.4"
http = "1.5.0"
rand = "0.10.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2"] }
rand_chacha = "0.10.0"
thiserror = "2.0.20"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "time", "sync"] }

[dev-dependencies]
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util"] }
